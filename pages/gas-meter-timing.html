            --panel-line: rgba(255, 255, 255, 0.09);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            margin: 0;
            min-height: 100vh;
            -webkit-text-size-adjust: 100%;
            padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
        }

        .wrap {
            max-width: 460px;
            margin: 0 auto;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 26px 0;
        }

        .eyebrow.tight {
            margin-bottom: 18px;
        }

        .field {
            position: relative;
            margin-bottom: 34px;
        }

        .field input {
            width: 100%;
            padding: 12px 52px 8px 0;
            font-size: 18px;
            color: var(--text);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            outline: none;
            -moz-appearance: textfield;
            font-variant-numeric: tabular-nums;
        }

        .field input::-webkit-outer-spin-button,
        .field input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .field::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: var(--text);
            transform: scaleX(0);
            transition: transform 0.2s ease;
        }

        .field:focus-within::after {
            transform: scaleX(1);
        }

        .field label {
            position: absolute;
            top: 12px;
            left: 0;
            font-size: 18px;
            color: var(--muted);
            pointer-events: none;
            transition: 0.2s ease all;
        }

        .field input:focus~label,
        .field input:not(:placeholder-shown)~label {
            top: -12px;
            font-size: 12px;
            color: var(--text);
        }

        .field .unit {
            position: absolute;
            right: 0;
            bottom: 10px;
            font-size: 13px;
            color: var(--muted);
            pointer-events: none;
        }

        .relation {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: -12px 0 30px 0;
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .relation::before,
        .relation::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--panel-line);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 12px;
            padding: 18px 18px 20px 18px;
        }

        .panel .caption {
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .panel .formula {
            font-size: 13px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            word-break: break-word;
        }

        .panel .value {
            font-size: 34px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin-top: 10px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
            margin-bottom: 12px;
        }

        .btn:active {
            opacity: 0.75;
        }

        .btn-primary {
            background: var(--text);
            color: var(--bg);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--text);
        }

        .btn-link {
            display: inline-block;
            width: auto;
            padding: 6px 0;
            margin: 0;
            background: none;
            border: none;
            color: var(--muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
            border-bottom: 1px solid var(--line);
        }

        .disabled {
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
    <style>
        .slide {
            display: none;
        }

        .slide.active {
            display: block;
            animation: fade 0.25s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateX(8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .choice-title {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .choice {
            display: flex;
            gap: 10px;
            margin-bottom: 36px;
        }

        .choice label {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--muted);
            font-size: 16px;
            transition: 0.2s;
        }

        .choice input {
            display: none;
        }

        .choice input:checked+label {
            background: var(--text);
            border-color: var(--text);
            color: var(--bg);
            font-weight: bold;
        }

        .clock {
            font-size: 54px;
            font-weight: bold;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .track {
            height: 2px;
            background: var(--panel-line);
            border-radius: 2px;
            margin-bottom: 34px;
            overflow: hidden;
        }

        .track span {
            display: block;
            height: 100%;
            width: 0;
            background: var(--text);
            transition: width 1s linear;
        }

        .recap {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 30px;
            font-variant-numeric: tabular-nums;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom));
            transform: translate(-50%, 20px);
            background: var(--text);
            color: var(--bg);
            padding: 12px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            white-space: nowrap;
        }

        #toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }
    </style>
</head>

    <div class="wrap">
        <div class="slide active" id="slide1">
            <p class="eyebrow">Шаг 1 · Замер</p>

            <div class="field" id="groupInitial">
                <input type="number" id="initial" placeholder=" " inputmode="decimal">
                <label for="initial">Начальные показания</label>
                <span class="unit">м³</span>
            </div>

            <div id="groupChoice">
                <div class="choice-title">Длительность замера, минуты</div>
                <div class="choice">
                    <input type="radio" id="time1" name="time" value="1">
                    <label for="time1">1</label>
                    <input type="radio" id="time2" name="time" value="2">
                    <label for="time2">2</label>
                    <input type="radio" id="time5" name="time" value="5">
                    <label for="time5">5</label>
                </div>
            </div>

            <div class="clock" id="clock">00:00</div>
            <div class="track"><span id="progress"></span></div>

            <button class="btn btn-primary" id="startBtn">Начать замер</button>
            <button class="btn btn-secondary" id="resetBtn" style="display: none;">Сброс</button>
        </div>

        <div class="slide" id="slide2">
            <p class="eyebrow">Шаг 2 · Конечные показания</p>

            <div class="recap" id="recap"></div>

            <div class="field">
                <input type="number" id="final" placeholder=" " inputmode="decimal">
                <label for="final">Конечные показания</label>
                <span class="unit">м³</span>
            </div>

            <button class="btn btn-primary" id="calcBtn">Подсчитать</button>
        </div>

        <div class="slide" id="slide3">
            <p class="eyebrow">Шаг 3 · Итог</p>

            <div class="panel">
                <div class="caption">Расход</div>
                <div class="formula" id="formula"></div>
                <div class="value" id="result"></div>
            </div>

            <button class="btn btn-primary" id="restartBtn" style="margin-top: 26px;">Новый замер</button>
        </div>
    </div>

    <div id="toast"></div>

        const audioTick = new Audio(base64Tick);
        const audioEnd = new Audio(base64End);

        let interval;
        let timeLeft = 0;
        let totalTime = 0;
        let selectedMins = 0;
        let toastTimeout;

        function clean(val) {
            return val.replace(/^0+(?=\d)/, '');
        }

        initial.addEventListener('input', function () {
            this.value = clean(this.value);
        });

        final.addEventListener('input', function () {
            this.value = clean(this.value);
        });

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
        }

        function showToast(msg) {
            clearTimeout(toastTimeout);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function goToSlide(n) {
            Object.keys(slides).forEach(key => slides[key].classList.remove('active'));
            slides[n].classList.add('active');
        }

        function drawProgress() {
            progress.style.width = totalTime > 0 ? (timeLeft / totalTime) * 100 + '%' : '0';
        }

        startBtn.addEventListener('click', () => {
            if (!initial.value.trim()) {
                showToast('Введите начальные показания');
                return;
            }

            const checked = document.querySelector('input[name="time"]:checked');
            if (!checked) {
                showToast('Укажите длительность');
                return;
            }

            audioTick.load();
            audioEnd.load();

            selectedMins = parseInt(checked.value);
            totalTime = selectedMins * 60;
            timeLeft = totalTime;
            clock.textContent = formatTime(timeLeft);
            progress.style.transition = 'none';
            drawProgress();
            requestAnimationFrame(() => {
                progress.style.transition = 'width 1s linear';
            });

            groupInitial.classList.add('disabled');
            groupChoice.classList.add('disabled');
            startBtn.style.display = 'none';
            resetBtn.style.display = 'block';

            interval = setInterval(() => {
                timeLeft--;
                clock.textContent = formatTime(timeLeft);
                drawProgress();

                if (timeLeft <= 5 && timeLeft > 0) {
                    audioTick.currentTime = 0;
                    audioTick.play().catch(() => { });
                }

                if (timeLeft === 0) {
                    clearInterval(interval);
                    audioEnd.currentTime = 0;
                    audioEnd.play().catch(() => { });
                    recap.textContent = 'Начальные показания ' + initial.value + ' м³ · замер ' + selectedMins + ' мин';
                    goToSlide(2);
                }
            }, 1000);
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(interval);
            timeLeft = 0;
            totalTime = 0;
            clock.textContent = '00:00';
            progress.style.transition = 'none';
            drawProgress();
            groupInitial.classList.remove('disabled');
            groupChoice.classList.remove('disabled');
            startBtn.style.display = 'block';
            resetBtn.style.display = 'none';
        });

        calcBtn.addEventListener('click', () => {
            if (!final.value.trim()) {
                showToast('Введите конечные показания');
                return;
            }

            const from = parseFloat(initial.value);
            const to = parseFloat(final.value);
            const value = (to - from) * (60 / selectedMins);

            formula.textContent = '(' + to + ' − ' + from + ') × (60 / ' + selectedMins + ')';
            result.textContent = parseFloat(value.toFixed(2)) + ' м³/ч';

            goToSlide(3);
        });

        restartBtn.addEventListener('click', () => {
            initial.value = '';
            final.value = '';
            const checked = document.querySelector('input[name="time"]:checked');
            if (checked) checked.checked = false;
            resetBtn.click();
            goToSlide(1);
        });
    </script>
