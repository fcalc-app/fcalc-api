    <title>Рассчет мощности и расхода</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #333544;
            color: #ffffff;
            font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 22px;
            margin: 10px 0 40px 0;
            font-weight: 600;
            text-align: left;
        }

        .input-group {
            position: relative;
            margin-bottom: 35px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0 5px 0;
            font-size: 18px;
            color: #ffffff;
            background: transparent;
            border: none;
            border-bottom: 1px solid #888;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }

        .input-group input::-webkit-outer-spin-button,
        .input-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-group input:focus {
            border-bottom: 2px solid #ffffff;
        }

        .input-group label {
            position: absolute;
            top: 10px;
            left: 0;
            font-size: 18px;
            color: #888;
            pointer-events: none;
            transition: 0.2s ease all;
        }

        .input-group input:focus~label,
        .input-group input:not(:placeholder-shown)~label {
            top: -15px;
            font-size: 12px;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="input-group">
        <input type="number" id="powerInput" placeholder=" " inputmode="decimal">
        <label for="powerInput">Мощность в кВт</label>
    </div>
    <div class="input-group">
        <input type="number" id="flowInput" placeholder=" " inputmode="decimal">
        <label for="flowInput">Расход в м³/ч</label>
    </div>
    <script>
        const powerInput = document.getElementById('powerInput');
        const flowInput = document.getElementById('flowInput');
        const FACTOR = 8.374;

        function cleanInput(val) {
            return val.replace(/^0+(?=\d)/, '');
        }

        powerInput.addEventListener('input', function () {
            this.value = cleanInput(this.value);
            let power = parseFloat(this.value);
            if (!isNaN(power)) {
                let flow = power / FACTOR;
                flowInput.value = parseFloat(flow.toFixed(2));
            } else {
                flowInput.value = '';
            }
        });

        flowInput.addEventListener('input', function () {
            this.value = cleanInput(this.value);
            let flow = parseFloat(this.value);
            if (!isNaN(flow)) {
                let power = flow * FACTOR;
                powerInput.value = Math.round(power);
            } else {
                powerInput.value = '';
            }
        });
    </script>
</body>

</html>
